<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ChatpyBot</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-slate-950 h-screen flex items-center justify-center">
    <div
      class="w-full max-w-3xl h-[90vh] bg-slate-900 rounded-3xl shadow-2xl flex flex-col"
    >
      <header class="p-5 border-b border-slate-700">
        <h1 class="text-3xl font-bold text-white">ChatpyBot</h1>

        <p class="text-slate-400">Pure Python + Gemini</p>
      </header>

      <div id="chat-box" class="flex-1 overflow-y-auto p-5 space-y-4"></div>

      <div class="p-4 border-t border-slate-700 flex gap-3">
        <input
          id="message"
          type="text"
          placeholder="Ask anything..."
          class="flex-1 bg-slate-800 text-white rounded-xl px-4 py-3 outline-none"
        />

        <button
          id="send"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-xl"
        >
          Send
        </button>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
